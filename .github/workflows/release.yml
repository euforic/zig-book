name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build publish folder
        run: zig build site

      - name: Validate generated site
        run: zig build check

      - name: Package site artifact
        run: |
          tag_name="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
          fi
          safe_tag="${tag_name//\//-}"
          tar -czf "zig-book-site-${safe_tag}.tar.gz" -C dist .
          zip -qr "zig-book-site-${safe_tag}.zip" dist
          {
            echo "tag_name=${tag_name}"
            echo "safe_tag=${safe_tag}"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            "zig-book-site-${safe_tag}.tar.gz"
            "zig-book-site-${safe_tag}.zip"
          )

          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag_name" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          args=(
            "$tag_name"
            "${files[@]}"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$tag_name"
            --notes "Static site artifact for The Zig Book."
          )

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
